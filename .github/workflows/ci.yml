name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - name: Lint
        run: uv run --python ${{ matrix.python }} --with ruff ruff check .
      - name: Test
        run: uv run --python ${{ matrix.python }} --extra dev pytest -q
      - name: The CLI starts
        # Cheap, and it catches the failure mode a unit test cannot: an import
        # that only breaks once the entry point is wired up.
        run: uv run --python ${{ matrix.python }} worclaude-bench --help
