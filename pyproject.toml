[project]
name = "worclaude-bench"
version = "0.1.0"
description = "Measure what a question costs through an indexed source versus through the MCP connectors your desktop client loads."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Worclaude contributors" }]
keywords = ["mcp", "tokens", "benchmark", "claude", "anthropic", "worclaude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "anthropic>=1.0",
    "httpx>=0.27",
    "mcp>=2.0",
]

[project.urls]
Homepage = "https://github.com/mohamagdy/worclaude-bench"
Repository = "https://github.com/mohamagdy/worclaude-bench"
Issues = "https://github.com/mohamagdy/worclaude-bench/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
worclaude-bench = "worclaude_bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worclaude_bench"]

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
